# Clever Cloud configuration, loaded through REPOLOGY_CONFIG on top of
# repology.conf.default
DSN = os.environ['POSTGRESQL_ADDON_URI']

# Repositories to fetch, parse and push to the database, comma separated
# (names from repos.d, e.g. fedora_rawhide,exherbo)
REPOSITORIES = os.environ.get('REPOLOGY_REPOSITORIES', 'fedora_rawhide,exherbo').split(',')

# Fail parsing when a repository has fewer packages than its minpackages
ENABLE_SAFETY_CHECKS = True
